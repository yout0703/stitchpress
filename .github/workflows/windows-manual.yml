name: Windows x64 build and verification
on:
  workflow_dispatch:
  push:
    branches: [main, codex/initial-implementation]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/windows-manual.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/windows-manual.yml'
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      # Windows runners may default redirected Python output to CP1252.
      # Reports and validation paths contain Chinese; use UTF-8 for the whole toolchain.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --all-groups
      - run: uv run --all-groups ruff check src tests tools
      - run: uv run --all-groups ruff format --check src tests tools
      - name: Run full Windows test suite
        timeout-minutes: 25
        run: |
          New-Item -ItemType Directory -Force reports/local/windows | Out-Null
          uv run --all-groups pytest -v -o faulthandler_timeout=180 --durations=12 --junitxml=reports/local/windows/tests.xml 2>&1 | Tee-Object -FilePath reports/local/windows/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: uv run --all-groups python tools/build_desktop.py
      - name: Verify packaged executable and Chinese installation directory
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/windows/StitchPress "dist/windows/绣印工坊测试"
          uv run --all-groups python tools/smoke_bundle.py "dist/windows/绣印工坊测试/StitchPress.exe" --output reports/local/windows/smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --all-groups python tools/validate_bundle_revisions.py "dist/windows/绣印工坊测试/StitchPress.exe" --output reports/local/windows/revisions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --all-groups python tools/validate_bundle_extensions.py "dist/windows/绣印工坊测试/StitchPress.exe" --output reports/local/windows/extensions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --all-groups python tools/validate_bundle_reference.py "dist/windows/绣印工坊测试/StitchPress.exe" --output reports/local/windows/reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --all-groups python tools/validate_bundle_commerce.py "dist/windows/绣印工坊测试/StitchPress.exe" --output reports/local/windows/commerce
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/windows/StitchPress -DestinationPath dist/windows/StitchPress-windows-x64-local.zip
      - name: Retain checks and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-checks-${{ github.run_id }}
          path: |
            reports/local/windows/
            dist/windows/build.log
          retention-days: 30
          if-no-files-found: warn
      - name: Retain unsigned local test application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-app-${{ github.run_id }}
          path: dist/windows/StitchPress-windows-x64-local.zip
          retention-days: 30
          if-no-files-found: error
